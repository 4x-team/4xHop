modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/4x-team/4xHop"
authors = "${mod_authors}"
description = '''
Advanced Bunnyhop, Auto-Bhop, and Air-Strafe client mod for Minecraft Forge 1.20.1.
Open-source software developed by FoxTeam.

Продвинутый клиентский мод на Bunnyhop, Auto-Bhop и настраиваемый Air-Strafe для Minecraft Forge 1.20.1.
Исходный код полностью открыт. Разработано FoxTeam.

Organization: https://github.com/4x-team/
Repository: https://github.com/4x-team/4xHop
'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
